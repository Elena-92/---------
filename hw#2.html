<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменение  текста в заголовке</title>
</head>
<body>
        <p id="myParagraph">Этот текст изначально такой. Нажмите кнопку ниже, чтобы изменить его цвет.</p>
        
        <button id="changeColorButton">Изменить текст</button>

    <script>
        const paragraph = document.querySelector('#myParagraph');
        const button = document.querySelector('#changeColorButton');

        button.addEventListener('click', function() {
            
            paragraph.style.color = 'blue';

        });

    </script>

</body>
</html>
