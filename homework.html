<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменение цвета текста</title>
</head>
<body>
        <p id="colorText">Этот текст изначально черный. Нажмите кнопку ниже, чтобы изменить его цвет.</p>
        
        <button id="colorButton">Изменить цвет</button>

    <script>
        const paragraphElement = document.querySelector('#colorText');
        const colorButton = document.querySelector('#colorButton');

        colorButton.addEventListener('click', function() {
            
            paragraphElement.style.color = 'blue';

        });
        
    </script>

</body>
</html>
